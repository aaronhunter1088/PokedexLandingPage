# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will check out the code, set up Node, build the
# landing page, and deploy it to the temporary directory. We then
# make a back up of the previous working version and deploy the
# new version.
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#Publishing-using-gradle

name: Landing Page Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Landing Page
        run: npm run deployLandingPageForServer

      - name: Upload Landing Page
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/PokedexLandingPage"
          target: "/tmp/deploy"

      - name: Copy Previous Working Version, Deploy New Version
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Stop script on a failing command rather than blindly continuing
            set -e

            # Verify uploaded build before touching production
            test -d /tmp/deploy/dist/PokedexLandingPage

            # Stop Tomcat 11 Service
            sudo systemctl stop tomcat11

            # Copy Previous Working Version
            cd /opt/tomcat11
            sudo rm -rf MyPokedexBackup/ROOT
            sudo mkdir -p MyPokedexBackup/ROOT
            sudo cp -a MyPokedex/ROOT/. MyPokedexBackup/ROOT/

            # Prepare New Version
            sudo rm -rf MyPokedex/ROOT
            sudo mv /tmp/deploy/dist/PokedexLandingPage /opt/tomcat11/MyPokedex/ROOT

            cd /opt/tomcat11/MyPokedex/ROOT
            sudo cp -a browser/. .
            sudo rm -rf browser

            # Update Ownership
            sudo chown -R tomcat:tomcat /opt/tomcat11/MyPokedex/ROOT
            sudo chown -R tomcat:tomcat /opt/tomcat11/MyPokedexBackup/ROOT

            # Update Permissions
            sudo find /opt/tomcat11/MyPokedex/ROOT -type d -exec chmod 755 {} \;
            sudo find /opt/tomcat11/MyPokedex/ROOT -type f -exec chmod 644 {} \;

            # Start Tomcat 11 Service
            sudo systemctl start tomcat11
            timeout 120 bash -c 'until sudo systemctl is-active --quiet tomcat11; do sleep 3; done'
            sudo journalctl -u tomcat11 -n 100 --no-pager
